<div class="cuisine">
  <header class="cuisine__header">
    <a routerLink="/" aria-label="Code à Cuisine, home">
      <img src="images/logo-green.png" alt="Code à Cuisine" width="142" height="48" />
    </a>

    <div class="cuisine__bar">
      <a class="cuisine__back" routerLink="/cookbook">
        <img src="images/icon-arrow.png" alt="" width="20" height="14" />
        Cookbook
      </a>
      <a class="cuisine__generate" routerLink="/generate">Generate a recipe</a>
    </div>
  </header>

  <main class="cuisine__main">
    <section class="cuisine__dishes" aria-labelledby="cuisine-title">
      <header class="cuisine__banner" [style.background-image]="headerImage">
        <h1 class="cuisine__title" id="cuisine-title">{{ title }}</h1>
      </header>

      <div class="cuisine__list"></div>

      <nav class="cuisine__pages" aria-label="Pages">
        <button class="cuisine__arrow" type="button" aria-label="Previous page" (click)="goTo(currentPage() - 1)">
          <img src="images/icon-page-prev.png" alt="" width="10" height="10" />
        </button>

        <ol class="cuisine__numbers">
          @for (page of pages(); track $index) {
            <li>
              @if (page === '...') {
                <span class="cuisine__number cuisine__number--gap">{{ page }}</span>
              } @else {
                <button
                  class="cuisine__number"
                  type="button"
                  [attr.aria-current]="page === currentPage() ? 'page' : null"
                  (click)="goTo(page)"
                >
                  {{ page }}
                </button>
              }
            </li>
          }
        </ol>

        <button class="cuisine__arrow" type="button" aria-label="Next page" (click)="goTo(currentPage() + 1)">
          <img src="images/icon-page-next.png" alt="" width="10" height="10" />
        </button>
      </nav>
    </section>
  </main>
</div>
